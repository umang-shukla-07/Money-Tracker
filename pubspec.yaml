name: ledgerlens
description: "A private, local-first personal finance Flutter app built for Indian banking formats."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  intl: ^0.19.0
  google_generative_ai: ^0.4.0
  fl_chart: ^0.66.2
  file_picker: ^8.0.0
  csv: ^6.0.0
  crypto: ^3.0.3
  provider: ^6.1.2
  flutter_secure_storage: ^10.3.4
  local_auth: ^2.3.0
  supabase_flutter: ^2.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
  assets:
    - fixtures/

